plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services'
    id 'kotlin-kapt'
    id 'com.google.dagger.hilt.android'
}

android {
    namespace 'com.codewithkael.firebasevideocall'
    compileSdk 34

    defaultConfig {
        applicationId "com.codewithkael.firebasevideocall"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0.5"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

    }

    buildTypes {

        release {
            //buildConfigField("String", "App_Link", "\"https://drive.google.com/file/d/1VoXKYUIVVPHr-VZGbQaXUyr721VN1TXk/view?usp=sharing\"")
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    viewBinding{
        enabled=true
    }

   buildFeatures{
       viewBinding=true

   }

    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/INDEX.LIST'
    }


}

dependencies {

   // implementation project(':libuvccamera')

    //implementation 'com.github.jiangdongguo.AndroidUSBCamera:libausbc:3.2.10'
   // implementation "com.github.jiangdongguo.AndroidUSBCamera:libausbc:3.3.3"

    implementation project(':libausbc')
    implementation project(':libuvc')
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation "androidx.activity:activity-ktx:1.9.0"
   // implementation 'androidx.activity:activity:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation platform('com.google.firebase:firebase-bom:32.2.0')
    implementation 'com.google.firebase:firebase-database-ktx:21.0.0' // Updated to version 21.0.0
    implementation 'com.google.firebase:firebase-database:21.0.0' // Updated to version 21.0.0
    implementation 'com.google.firebase:firebase-auth-ktx:22.3.1'
   // implementation 'com.google.firebase:firebase-auth:20.2.2'
    implementation 'com.google.android.gms:play-services-auth:21.1.0'
    implementation 'com.google.android.gms:play-services-auth-api-phone:18.0.2'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.mesibo.api:webrtc:1.0.5'

    implementation 'com.google.dagger:hilt-android:2.44'
    kapt "com.google.dagger:hilt-compiler:2.44"
    implementation 'androidx.browser:browser:1.3.0'
    implementation 'com.guolindev.permissionx:permissionx:1.6.1'

    //QR Code
    implementation 'com.google.zxing:core:3.4.1'
    implementation 'com.journeyapps:zxing-android-embedded:4.2.0'
    implementation 'io.github.thanosfisherman.wifiutils:wifiutils:1.6.6'

    //Retrofit
    implementation 'com.squareup.okhttp3:okhttp:4.9.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.5.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.5.2'

    //VideoIntelegince Api
   // implementation 'com.google.cloud:google-cloud-video-intelligence:1.5.0'

    //vision ai
//    implementation 'com.google.ai.client:generativeai:1.0.0'
        implementation 'com.google.ai.client.generativeai:generativeai:0.8.0'

    //Google cloud vision api text to speech
    implementation 'com.google.cloud:google-cloud-texttospeech:2.47.0'

//    //open AI
//    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
//    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
//    implementation 'com.github.bumptech.glide:glide:4.12.0' // optional for image handling
//    implementation 'com.dynatrace.agent: agent-android: 8.247.1.1003'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'

    var camerax_version = "1.4.0-beta02"
    // The following line is optional, as the core library is included indirectly by camera-camera2
    implementation("androidx.camera:camera-core:${camerax_version}") {
        exclude group: "androidx.annotation", module: "annotation"
        exclude group: "androidx.core", module: "core"
    }
   implementation("androidx.camera:camera-camera2:${camerax_version}")
    // If you want to additionally use the CameraX Lifecycle library
 implementation("androidx.camera:camera-lifecycle:${camerax_version}") {
     exclude group: "androidx.annotation", module: "annotation"
     exclude group: "androidx.core", module: "core"
 }
    // If you want to additionally use the CameraX VideoCapture library
/*    implementation("androidx.camera:camera-video:${camerax_version}")
    // If you want to additionally use the CameraX View class
    implementation("androidx.camera:camera-view:${camerax_version}")*/
    // If you want to additionally add CameraX ML Kit Vision Integration
    implementation("androidx.camera:camera-mlkit-vision:${camerax_version}")
    // If you want to additionally use the CameraX Extensions library
  implementation("androidx.camera:camera-extensions:${camerax_version}") {
      exclude group: "androidx.annotation", module: "annotation"
      exclude group: "androidx.core", module: "core"
  }
    implementation ("com.android.tools:r8:8.3.37")
    implementation("com.google.mlkit:text-recognition:16.0.0")
    implementation("com.google.android.gms:play-services-mlkit-text-recognition:19.0.0")


    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
